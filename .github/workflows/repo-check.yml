name: repo-check

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'tools/**'
      - '*.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 本仓没有 requirements.txt：显式装检查依赖，别把应用依赖带进来。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants
        run: python tools/repo-kit/check_repo.py --root .
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
