<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板</title>
<!-- v0.6.15：favicon 用 📋 emoji 内嵌 SVG data-URI（零额外文件，浏览器/平台均生效；尖括号编码保证严格解析器兼容） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   暗黑新拟态 Neumorphism（酒红金版 v2）
   依据《UI迁移手册.md》层0-层4 + dark-design-style-guide「酒红金」配色
   ============================================================ */
:root{
  /* 层0 · 设计令牌（酒红金 · 校准版，对齐 dark-design-style-guide 主页示意 mock：
     中性黑灰底 #1A1A1A/#2F2F2F + 金 #C9A96E 主强调 + 砖红 #AE4D4D 点缀 + 中性文字 #DADADA） */  --bg:#1A1A1A; --elev:#1F1F1F; --elev-hi:#2A2A2A; --inset:#141414; --border:#3D3D3D;
  --text:#DADADA; --muted:#848484; --dim:#6E6E6E;
  --accent:#C9A96E;          /* 金 · 主强调(按钮/选中/选区/标签 active)，深字配 */
  --accent2:#AE4D4D;         /* 砖红 · 点缀(链接徽章/危险 hover/链接文字 hover)，暖白字配 */
  --green:#9FBF8F;           /* 文本徽章：暖绿（中性底上保持辨识） */
  --amber:#D4AF37;           /* 文件徽章：亮金（与主强调区分） */
  --blue:#AE4D4D;            /* 链接徽章：砖红（对应主题里的"红"点缀，与 mac2 统一） */
  --red:#E08A7A;             /* 危险/错误：暖红高亮（与点缀砖红区分） */
  /* 彩色 RGB 三元组（v0.6.13：供 rgba(var(--x),alpha) 使用——灰度模式一处覆盖全部变灰） */
  --gold:201,169,110; --amber-rgb:212,175,55; --accent2-rgb:174,77,77; --green-rgb:159,191,143;
  --blue2-rgb:143,163,184; --blue3-rgb:127,157,255; --red-rgb:224,138,122; --red2-rgb:224,122,122;
  /* 圆角 */
  --r-md:14px; --r-lg:18px; --r-pill:99px;
  /* 双阴影 tokens（校准版：中性黑灰高光，金棕凸起感由主色承担） */
  --sh-raised:  1px 1px 3px rgba(0,0,0,.5),  -1px -1px 3px rgba(88,88,88,.35);
  --sh-raised-sm:1px 1px 3px rgba(0,0,0,.45), -1px -1px 3px rgba(88,88,88,.3);
  --sh-raised-lg:1px 1px 5px rgba(0,0,0,.52), -1px -1px 5px rgba(88,88,88,.38);
  --sh-inset:  inset 1px 1px 4px rgba(0,0,0,.5),  inset -1px -1px 4px rgba(88,88,88,.32);
  --sh-inset-sm:inset 1px 1px 3px rgba(0,0,0,.45), inset -1px -1px 3px rgba(88,88,88,.28);
  --sh-press:  inset 1px 1px 4px rgba(0,0,0,.52), inset -1px -1px 4px rgba(88,88,88,.35);
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* v0.6.13：无饱和度（灰度）配色——html.mono 一键切换（按钮 + localStorage 记忆）。
   全部彩色令牌灰化：主强调/点缀/徽章/链接色统一中性灰阶，仅保留明暗层次 */
:root.mono{
  --gold:152,152,152; --amber-rgb:160,160,160; --accent2-rgb:138,138,138; --green-rgb:148,148,148;
  --blue2-rgb:146,146,146; --blue3-rgb:150,150,150; --red-rgb:140,140,140; --red2-rgb:140,140,140;
  --accent:#A8A8A8; --accent2:#8F8F8F; --green:#9C9C9C; --amber:#A5A5A5; --blue:#8F8F8F; --red:#909090;
}
:root.mono .clip-card .code .dots{background:radial-gradient(circle at 4px 4px,#8F8F8F 3px,transparent 3.5px),radial-gradient(circle at 17px 4px,#A5A5A5 3px,transparent 3.5px),radial-gradient(circle at 30px 4px,#9C9C9C 3px,transparent 3.5px)}
:root.mono .clip-card .fic.pdf{color:#909090;border-color:rgba(140,140,140,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
/* 层1 · 输入元素（凹陷内嵌） */
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--inset);border:none;border-radius:12px;padding:9px 12px;outline:none;width:100%;box-shadow:var(--sh-inset-sm);transition:.18s}
input:focus,textarea:focus{box-shadow:var(--sh-inset)}
::selection{background:var(--accent);color:#101014}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* 层1 · 按钮四态 */
.btn{border-radius:12px;padding:8px 15px;font-size:13px;color:var(--muted);background:var(--elev);box-shadow:var(--sh-raised-sm);transition:.16s;white-space:nowrap}
.btn:hover{color:var(--text);background:var(--elev-hi)}
.btn:active{box-shadow:var(--sh-press);transform:translateY(1px)}
.btn.busy,.btn:disabled{opacity:.5;cursor:wait;pointer-events:none}
.btn.primary{background:var(--accent);color:#101014;border:none;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent2)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:10px}
.btn.danger:hover{color:var(--red)}
.btn.on{color:var(--amber)}

/* 层2 · 容器 */
/* v0.6.15 宽屏自适应：基础 960px（兼容窄屏），≥1280px 放宽到 1440px，≥1920px(4K) 放宽到 1920px——
   卡片墙自动多列铺开（.list auto-fill 随容器变宽），充分利用宽屏宽度 */
.view{max-width:960px;margin:0 auto;padding:24px 16px 80px}
@media (min-width:1280px){.view{max-width:1440px}}
@media (min-width:1920px){.view{max-width:1920px}}
.hidden{display:none!important}
.serif{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,Georgia,serif}
/* 用户选择页（v0.6.3 · 极简墙：居中品牌 + 紧凑卡片网格 + 底部编辑胶囊） */
.wall{max-width:960px;margin:0 auto;padding:52px 20px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
@media (min-width:1280px){.wall{max-width:1440px}}
@media (min-width:1920px){.wall{max-width:1920px}}
.brand{text-align:center;margin-bottom:44px}
.brand .mark{width:44px;height:44px;margin:0 auto 14px;border-radius:14px;background:var(--inset);box-shadow:var(--sh-inset);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-family:"Noto Serif SC","Songti SC",STSong,Georgia,serif}
.brand h1{font-size:clamp(20px,2.6vw,26px);font-weight:500;letter-spacing:.14em}
.brand .sub{margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.05em}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.user-card{position:relative;padding:22px 14px 18px;text-align:center;cursor:pointer;background:var(--elev);border-radius:var(--r-md);box-shadow:var(--sh-raised);transition:box-shadow .22s var(--ease),background .22s var(--ease)}
.user-card:hover{background:var(--elev-hi);box-shadow:var(--sh-raised-lg),0 0 0 1.5px rgba(var(--gold),.3)}
.user-card:active{box-shadow:var(--sh-inset)}
.user-grid.editing .user-card{box-shadow:var(--sh-raised),0 0 0 1.5px rgba(var(--red2-rgb),.5)}
.user-card .del-user-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--inset);box-shadow:var(--sh-inset);color:var(--red);z-index:2;opacity:0;transition:opacity .18s var(--ease)}
.user-grid.editing .user-card .del-user-btn{opacity:1}
.user-card .del-user-btn:hover{background:var(--red);color:#fff}
.user-card .avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#101014;box-shadow:var(--sh-inset)}
.user-card .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .cnt{color:var(--dim);font-size:11px;margin-top:3px}
.add-user{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:transparent;border:1.5px dashed var(--border);color:var(--dim);border-radius:var(--r-md);min-height:118px;font-size:12px;cursor:pointer;transition:border-color .22s var(--ease),color .22s var(--ease)}
.add-user:hover{border-color:var(--accent);color:var(--accent)}
.add-user .plus{font-size:20px;line-height:1;color:var(--accent)}
.user-actions{margin-top:34px;display:flex;justify-content:center;gap:8px;align-items:center}
.user-actions .btn{border-radius:var(--r-pill);padding:9px 22px;font-size:13px}
.user-actions .btn.ghost.on{color:var(--accent);background:var(--inset);box-shadow:var(--sh-inset)}
.user-foot{margin-top:22px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.2em}
.empty-state{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--dim);font-size:13px}
/* 主页面 */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;margin-bottom:14px;flex-wrap:wrap;background:var(--elev);box-shadow:var(--sh-raised);border-radius:var(--r-lg)}
.topbar .t-logo{font-size:22px}
.topbar h1{font-size:18px;font-weight:600;flex:1;min-width:120px}
.topbar .who{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .dot{width:10px;height:10px;border-radius:50%;box-shadow:var(--sh-inset-sm)}
.paste-box{background:var(--elev);box-shadow:var(--sh-raised);border:none;border-radius:var(--r-md);padding:12px;margin-bottom:16px}
.paste-box.drag{box-shadow:var(--sh-raised),0 0 0 1.5px rgba(var(--blue3-rgb),.6)}
.paste-box textarea{min-height:56px;resize:vertical}
.paste-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.adv-box{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adv-box input,.adv-box select{flex:1;min-width:130px}
/* 存入弹窗（方案26 · 沉浸输入）：类型徽章实时识别 + 重复提示条 */
.paste-modal{max-width:600px}
.paste-body .p-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.paste-body .p-head .p-ic{width:36px;height:36px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);display:flex;align-items:center;justify-content:center;font-size:16px}
.paste-body .p-head h3{font-size:17px;font-weight:500;margin:0}
.paste-body .p-head .p-who{margin-left:auto;font-size:11px;color:var(--dim);padding:2px 10px;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset-sm)}
.paste-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 11px;border-radius:var(--r-pill);font-weight:500;transition:all .2s}
.paste-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.paste-badge.text{background:rgba(var(--green-rgb),.15);color:var(--green)}
.paste-badge.link{background:rgba(var(--accent2-rgb),.15);color:#D98A8A}
.paste-badge.file{background:rgba(var(--gold),.15);color:var(--amber)}
.paste-badge.rich{background:rgba(var(--blue2-rgb),.15);color:var(--blue)} /* ✦ 格式文本（存入时 html 已捕获） */
/* 徽章行：左侧类型徽章 + 右侧一键清空（v0.6.6：自动读取剪贴板后可随时清空重输） */
.paste-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.paste-badge-row .paste-badge{margin-bottom:0}
.paste-clear{margin-left:auto;flex-shrink:0;border:none;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--dim);font-size:11px;padding:4px 12px;border-radius:var(--r-pill);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;font-family:inherit}
.paste-clear:hover{color:var(--red)}
.paste-body textarea{width:100%;min-height:150px;background:var(--inset);box-shadow:var(--sh-inset);border:none;border-radius:14px;padding:15px 16px;color:var(--text);font-size:13.5px;line-height:1.7;resize:vertical;outline:none;font-family:inherit;transition:box-shadow .2s}
.paste-body textarea:focus{box-shadow:var(--sh-inset),0 0 0 1.5px rgba(var(--gold),.4)}
.paste-body textarea::placeholder{color:var(--dim)}
/* 重复提示条（实时检测） */
.paste-dup{display:none;align-items:center;gap:10px;margin-top:10px;background:rgba(var(--amber-rgb),.08);border:1px solid rgba(var(--amber-rgb),.35);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--amber)}
.paste-dup.show{display:flex}
.paste-dup .dup-ic{font-size:15px}
.paste-dup .dup-txt{flex:1;min-width:0}
.paste-dup .dup-txt .t1{color:var(--amber)}
.paste-dup .dup-txt .t2{font-size:10.5px;color:var(--dim);margin-top:1px}
.paste-dup .dup-act{flex-shrink:0;display:flex;gap:6px}
.paste-dup .dup-act button{border:none;cursor:pointer;font-family:inherit;font-size:11px;padding:5px 12px;border-radius:var(--r-pill);transition:all .15s;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted)}
.paste-dup .dup-act button:hover{color:var(--text)}
.paste-dup .dup-act button.primary{background:rgba(var(--amber-rgb),.2);color:var(--amber)}
.paste-dup .dup-act button.primary:hover{background:var(--amber);color:var(--bg)}
/* 文件 chip */
.paste-body .file-chip{display:flex;align-items:center;gap:10px;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:12px;padding:11px 14px;margin-top:10px;font-size:13px}
.paste-body .file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paste-body .file-chip .fsize{font-size:11px;color:var(--dim)}
.paste-body .file-chip .rm{border:none;background:var(--elev);box-shadow:var(--sh-inset-sm);color:var(--dim);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:11px;flex-shrink:0}
.paste-body .file-chip .rm:hover{color:var(--red)}
/* 高级选项 */
.paste-adv{border-top:1px solid var(--border);margin-top:14px;padding-top:14px}
.paste-adv .adv-row{display:flex;gap:10px}
.paste-adv .adv-row input[type=text]{flex:1;min-width:0;background:var(--inset);box-shadow:var(--sh-inset-sm);border:none;border-radius:10px;padding:10px 13px;color:var(--text);font-size:12.5px;outline:none}
.paste-adv .adv-row input[type=text]:focus{box-shadow:var(--sh-inset-sm),0 0 0 1.5px rgba(var(--gold),.4)}
.paste-adv .adv-row select{flex:0 0 138px;background:var(--inset);box-shadow:var(--sh-inset-sm);border:none;border-radius:10px;padding:10px 13px;color:var(--text);font-size:12.5px;cursor:pointer}
.paste-adv .tag-pick{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.paste-adv .tag-pick .tag{font-size:11.5px;padding:4px 12px;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted);cursor:pointer;transition:all .15s}
.paste-adv .tag-pick .tag.on{background:rgba(var(--gold),.18);color:var(--amber)}
.paste-adv .tag-pick input{width:110px;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:11.5px;padding:4px 2px;outline:none}
.paste-adv .tag-pick input::placeholder{color:var(--dim)}
/* 操作行 */
.paste-actions{display:flex;gap:10px;margin-top:16px}
.paste-actions .btn{flex:1;padding:12px 0;font-size:13px;font-weight:500;border-radius:var(--r-pill)}
.paste-actions .btn-file{flex:0 0 112px;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted)}
.paste-actions .btn-file:hover{color:var(--text)}
.paste-actions .btn-close{flex:0 0 88px;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted)}
.paste-actions .btn-close:hover{color:var(--text)}
.paste-hint{text-align:center;font-size:10.5px;color:var(--dim);margin-top:12px}
/* 主页面工具条（v0.6.4 双行：行1 搜索+存入右置 / 行2 类型+标签+操作） */
.tb{background:var(--elev);border-radius:var(--r-md);box-shadow:var(--sh-raised);padding:12px 14px;margin-bottom:16px}
.tb .row1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tb .row1 .search{flex:1;border:none;outline:none;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset);color:var(--text);padding:10px 20px;font-size:14px;font-family:inherit;transition:box-shadow .18s var(--ease)}
.tb .row1 .search:focus{box-shadow:var(--sh-inset),0 0 0 1.5px rgba(var(--gold),.45)}
.store-btn{flex-shrink:0;border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:10px 22px;border-radius:var(--r-pill);background:var(--accent);color:#101014;font-weight:500;box-shadow:var(--sh-raised);display:flex;align-items:center;gap:7px;transition:all .18s var(--ease)}
.store-btn:hover{background:var(--amber)}
.store-btn:active{box-shadow:var(--sh-inset);transform:translateY(1px)}
.store-btn .plus{font-size:15px;line-height:1}
.tb .row2{display:flex;align-items:center;gap:10px;flex-wrap:nowrap} /* v0.6.6:单行不换行,避免错位堆叠 */
.tb .row2 .typetab{margin-bottom:0;flex-shrink:0}
.tagbar-wrap{flex:1;min-width:0;overflow:visible} /* v0.6.13:标签多时换行,全部可见(不再截断隐藏) */
.tb .ops{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-shrink:0;flex-wrap:nowrap} /* 单行 */
.tb .ops .opt{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap}
/* ===== 新拟态开关（v0.6.6 重做：凸起轨道+凸起滑块；选中=金晕轨道+金色滑块滑右——位置+颜色双信号，0.2s 过渡，focus 可见性，label 热区） ===== */
/* 轨道：内凹深底；选中：金晕(内发光+金描边) */
.opt input[type=checkbox],.tb .ops .opt input[type=checkbox],.dm-opt input[type=checkbox]{appearance:none;-webkit-appearance:none;border:none;position:relative;cursor:pointer;margin:0;flex-shrink:0;border-radius:99px;background:var(--inset);box-shadow:inset 1px 1px 3px rgba(0,0,0,.5),inset -1px -1px 3px rgba(88,88,88,.24);transition:background .2s,box-shadow .2s;outline:none}
.opt input[type=checkbox]{width:38px;height:22px}
.tb .ops .opt input[type=checkbox]{width:32px;height:18px}
.dm-opt input[type=checkbox]{width:34px;height:19px}
/* 滑块：凸起深灰；选中：金色+微光 */
.opt input[type=checkbox]::after,.tb .ops .opt input[type=checkbox]::after,.dm-opt input[type=checkbox]::after{content:"";position:absolute;border-radius:50%;background:var(--elev-hi);box-shadow:2px 2px 4px rgba(0,0,0,.5),-1px -1px 3px rgba(88,88,88,.35);transition:left .2s,background .2s,box-shadow .2s}
.opt input[type=checkbox]::after{top:3px;left:3px;width:16px;height:16px}
.tb .ops .opt input[type=checkbox]::after{top:2.5px;left:2.5px;width:13px;height:13px}
.dm-opt input[type=checkbox]::after{top:2px;left:2px;width:15px;height:15px}
/* 选中态：轨道金晕 + 滑块滑右变金 */
.opt input[type=checkbox]:checked,.tb .ops .opt input[type=checkbox]:checked,.dm-opt input[type=checkbox]:checked{background:rgba(var(--gold),.22);box-shadow:inset 1px 1px 3px rgba(0,0,0,.4),inset -1px -1px 3px rgba(var(--gold),.18),0 0 0 1px rgba(var(--gold),.45)}
.opt input[type=checkbox]:checked::after{left:19px;background:var(--accent);box-shadow:0 0 6px rgba(var(--gold),.55),1px 1px 3px rgba(0,0,0,.4)}

.clip-card{background:var(--elev);box-shadow:var(--sh-raised);border:none;border-radius:var(--r-lg);padding:14px 16px 12px;cursor:pointer;transition:.2s;position:relative;min-width:0;display:flex;flex-direction:column;gap:8px;height:190px} /* 方案18 统一等高（长内容在内容区内滚动查看，不改变卡高） */
/* 注意：hover/active 不用 transform——卡片内部挂 position:fixed 的图片预览浮层，
   transform 会创建 containing block 使 fixed 相对卡片而非视口，导致浮层定位错乱（bug 修复） */
.clip-card:hover{background:var(--elev-hi);box-shadow:var(--sh-raised-lg),0 0 0 1.5px rgba(var(--gold),.28)}
.clip-card:active{box-shadow:var(--sh-press)}

.clip-card.pinned{box-shadow:1px 1px 3px rgba(0,0,0,.5),-1px -1px 3px rgba(88,88,88,.35),0 0 0 1.5px rgba(var(--amber-rgb),.65)}
.clip-card.pinned:hover{box-shadow:1px 1px 5px rgba(0,0,0,.52),-1px -1px 5px rgba(88,88,88,.38),0 0 0 1.5px rgba(var(--amber-rgb),.65)}
/* 顶部徽章行（固定） */
.clip-card .row1{display:flex;align-items:center;gap:8px;min-height:26px;flex-shrink:0}
.clip-card .title{font-weight:500;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clip-card .status{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.clip-card .status .st{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);font-weight:500;white-space:nowrap}
.clip-card .status .st.pin{background:rgba(var(--amber-rgb),.16);color:var(--amber)}
.clip-card .status .st.exp{background:rgba(var(--accent2-rgb),.16);color:#D98A8A}
.clip-card .status .st.arch{background:var(--border);color:var(--muted)}
/* 文本内容（v0.6.5：等高 190 内 flex 撑满；内容多时内部滚动查看全文——保留换行，不截断不撑高卡片） */
.clip-card .pv{flex:1;min-height:0;color:var(--muted);font-size:12px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-family:inherit;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:9px 11px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:transparent transparent}
.clip-card .pv::-webkit-scrollbar{width:4px}
.clip-card .pv::-webkit-scrollbar-thumb{background:transparent;border-radius:2px}
.clip-card:hover .pv{scrollbar-color:var(--border) transparent}
.clip-card:hover .pv::-webkit-scrollbar-thumb{background:var(--border)}
.clip-card .pv::-webkit-scrollbar-thumb:hover{background:var(--dim)}
/* JSON 代码窗 */
.clip-card .code{position:relative;overflow:hidden;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:9px 12px;flex:1;min-height:0}
.clip-card .code .dots{position:absolute;top:8px;left:10px;width:34px;height:8px;background:radial-gradient(circle at 4px 4px,#E08A7A 3px,transparent 3.5px),radial-gradient(circle at 17px 4px,#D4AF37 3px,transparent 3.5px),radial-gradient(circle at 30px 4px,#9FBF8F 3px,transparent 3.5px);opacity:.8}
.clip-card .code .fname{position:absolute;top:5px;left:52px;font-size:10px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.clip-card .code pre{margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.6;color:var(--muted);white-space:pre;overflow:hidden;position:relative}
.clip-card .code pre::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(180deg,transparent,var(--inset))}
.clip-card .code pre .k{color:var(--accent)}
.clip-card .code pre .s{color:var(--green)}
/* 链接卡内容：URL + 打开主按钮 */
.clip-card .linkbody{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.clip-card .url{font-size:11.5px;font-family:ui-monospace,Consolas,monospace;color:var(--blue);background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:8px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-card .main-btn{align-self:flex-start;margin-top:auto;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;padding:6px 15px;border-radius:var(--r-pill);background:var(--accent);color:var(--bg);font-weight:500;box-shadow:var(--sh-raised-sm);display:flex;align-items:center;gap:6px;transition:all .16s}
.clip-card .main-btn:hover{background:var(--amber)}
.clip-card .main-btn:active{box-shadow:var(--sh-inset-sm);transform:translateY(1px)}
/* 图片卡内容：cover 撑满 */
.clip-card .imgwrap{min-height:0;background:var(--inset);border-radius:10px;overflow:hidden;position:relative;flex:1}

.clip-card .filebody{flex:1;min-height:0;display:flex;align-items:center;gap:14px;padding:2px 0}
.clip-card .fic{width:46px;height:56px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border)}
.clip-card .fic .fold{position:absolute;top:-1px;left:6px;width:18px;height:5px;background:var(--elev-hi);border-radius:3px 3px 0 0}
.clip-card .fic.pdf{color:#E08A7A;border:1px solid rgba(var(--red-rgb),.35)}

.clip-card .finfo{min-width:0}

/* 底部 meta 行：信息 + 其余操作（✎ 编辑 / ↓ 下载 / {} JSON） */

.clip-card .rich-split{display:flex;flex-direction:column;min-height:0;flex:1;border:1px dashed rgba(var(--gold),.26);border-radius:10px;overflow:hidden;background:var(--inset);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

.tabs{display:flex;gap:6px;margin-bottom:12px;padding:6px;border-radius:14px;background:var(--inset);box-shadow:var(--sh-inset-sm)}
.tab{font-size:13px;padding:6px 14px;border-radius:10px;color:var(--muted);cursor:pointer;transition:.18s}
.tab.on{color:var(--accent2);background:var(--elev);box-shadow:var(--sh-raised-sm);font-weight:600}
.dropzone{border:none;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.18s;background:var(--inset);box-shadow:var(--sh-inset-sm)}
.dropzone:hover{box-shadow:var(--sh-inset);color:var(--accent2)}
.dropzone.drag{box-shadow:var(--sh-inset),0 0 0 1.5px rgba(var(--blue3-rgb),.6);color:var(--accent2)}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:7px 12px;font-size:13px;margin-top:8px;color:var(--text)}
.file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-mgmt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.empty{text-align:center;color:var(--dim);padding:48px 0;font-size:13px}
.toast-err{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;z-index:99;box-shadow:var(--sh-raised-lg)}
/* 数据管理弹窗（方案25 · 双栏工作台） */
.dm-modal{max-width:640px;padding:0;display:flex;flex-direction:column;max-height:84vh}
.dm-modal::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:var(--r-lg) var(--r-lg) 0 0;pointer-events:none}
.dm-head{display:flex;align-items:center;gap:10px;padding:22px 26px 16px}
.dm-head .ic{width:36px;height:36px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dm-head h3{font-size:17px;font-weight:500;margin:0}
.dm-head .who{margin-left:auto;font-size:11px;color:var(--dim);padding:2px 10px;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset-sm)}
.dm-body{display:flex;flex:1;min-height:0;overflow-y:auto}
.dm-col{flex:1;min-width:0;padding:0 26px 20px}
.dm-col+.dm-col{border-left:1px solid var(--border)}
.dm-col-t{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:12px}
.dm-col-t .n{width:18px;height:18px;border-radius:6px;background:var(--accent);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace;flex-shrink:0}
.dm-col input[type=text],.dm-col input[type=password],.dm-col input[type=number]{width:100%;background:var(--inset);box-shadow:var(--sh-inset-sm);border:none;border-radius:10px;padding:10px 12px;color:var(--text);font-size:12.5px;outline:none;margin-bottom:8px;transition:box-shadow .2s}
.dm-col input:focus{box-shadow:var(--sh-inset-sm),0 0 0 1.5px rgba(var(--gold),.4)}
.dm-divider{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:10px;margin:12px 0;letter-spacing:.1em}
.dm-divider::before,.dm-divider::after{content:"";flex:1;height:1px;background:var(--border)}
.dm-opt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;margin:5px 0}
/* .dm-opt 开关由「新拟态开关」统一规则管理（见层3上方） */
.dm-opt select{background:var(--inset);box-shadow:var(--sh-inset-sm);border:none;border-radius:8px;color:var(--text);font-size:11.5px;padding:5px 8px;cursor:pointer}
.dm-btn{width:100%;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;padding:10px 0;border-radius:var(--r-pill);transition:all .16s;margin-top:6px}
.dm-btn.gold{background:var(--accent);color:var(--bg);box-shadow:var(--sh-raised-sm)}
.dm-btn.gold:hover{background:var(--amber)}
.dm-btn.ghost{background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted)}
.dm-btn.ghost:hover{color:var(--text)}
.dm-btn.danger{background:transparent;border:1px solid rgba(var(--accent2-rgb),.5);color:#D98A8A}
.dm-btn.danger:hover{background:var(--red);color:#fff}
.dm-status{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.6;min-height:14px}
.dm-status.ok{color:var(--green)}
.dm-status.err{color:#D98A8A}
.dm-danger-zone{margin-top:12px;border:1px solid rgba(var(--accent2-rgb),.3);border-radius:12px;padding:12px}
.dm-danger-zone .dz-t{font-size:11px;color:#D98A8A;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.dm-note{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.5}
.dm-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 26px;border-top:1px solid var(--border);flex-shrink:0}
.dm-foot .hint{font-size:10.5px;color:var(--dim)}
/* 编辑弹窗（方案32 v2 · 五类型差异化：文本/富文本/链接/图片/文件） */
.edit-modal{max-width:560px}
.edit-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edit-head .ic{width:36px;height:36px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.edit-head h3{font-size:16px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.edit-type{font-size:10.5px;padding:3px 11px;border-radius:var(--r-pill);font-weight:500;flex-shrink:0}
.edit-type.text{background:rgba(var(--green-rgb),.15);color:var(--green)}
.edit-type.rich{background:rgba(var(--blue2-rgb),.15);color:var(--blue)}
.edit-type.link{background:rgba(var(--accent2-rgb),.15);color:#D98A8A}
.edit-type.image{background:rgba(var(--gold),.15);color:var(--amber)}
.edit-type.file{background:rgba(var(--gold),.15);color:var(--amber)}
.edit-dup{border:1px solid rgba(var(--amber-rgb),.4);background:rgba(var(--amber-rgb),.08);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.edit-dup .t1{color:var(--amber);font-size:12px;font-weight:500}
.edit-dup .t2{color:var(--dim);font-size:11px;margin-top:2px}
.edit-sec{background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px}
.edit-sec-t{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--muted);margin-bottom:9px}
.edit-sec-t .n{width:18px;height:18px;border-radius:6px;background:var(--accent);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace}
.edit-sec-t .hint{margin-left:auto;font-size:10px;color:var(--dim);font-weight:400}
.edit-sec-t .btn.warn{color:var(--red);border:1px solid rgba(var(--red-rgb),.55);background:var(--inset);box-shadow:var(--sh-inset-sm)}
.edit-sec textarea{width:100%;min-height:110px;background:var(--elev);box-shadow:var(--sh-inset-sm);border:none;border-radius:10px;padding:11px 13px;color:var(--text);font-size:13px;line-height:1.7;resize:vertical;outline:none;font-family:inherit}
.edit-sec textarea:focus{box-shadow:var(--sh-inset-sm),0 0 0 1.5px rgba(var(--gold),.4)}
.edit-sec input[type=text]{width:100%;background:var(--elev);box-shadow:var(--sh-inset-sm);border:none;border-radius:9px;padding:10px 12px;color:var(--text);font-size:12.5px;outline:none}
.edit-sec input[type=text]:focus{box-shadow:var(--sh-inset-sm),0 0 0 1.5px rgba(var(--gold),.4)}
.edit-sec select{background:var(--elev);box-shadow:var(--sh-inset-sm);border:none;border-radius:9px;padding:10px 12px;color:var(--text);font-size:12.5px;cursor:pointer}
.edit-row{display:flex;gap:10px}
.edit-row input{flex:1;min-width:0}
.edit-row select{flex:0 0 126px}
/* 编辑弹窗标签区:v0.6.12 补 margin-top(此前与上方别名/过期行零间距紧贴,视觉重叠)+ 输入框透明下划线式(与存入弹窗一致,去内阴影) */
.edit-modal .tag-pick{margin-top:10px}
.edit-modal .tag-pick input{width:110px;min-width:110px;flex:0 0 auto;background:transparent;box-shadow:none;border:none;border-bottom:1px dashed var(--border);border-radius:0;padding:4px 2px;font-size:11.5px;color:var(--text);outline:none}
.edit-modal .tag-pick input::placeholder{color:var(--dim)}
/* 图片卡 */
.img-card{background:var(--elev);box-shadow:var(--sh-inset-sm);border-radius:11px;padding:10px;position:relative;overflow:hidden}
.img-card .thumb{width:100%;height:130px;border-radius:8px;background:var(--inset);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.img-card .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.img-card .thumb .zoom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.3);opacity:0;transition:opacity .2s}
.img-card:hover .thumb .zoom{opacity:1}
.img-card .thumb .zoom i{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--sh-raised-sm)}
.img-info{display:flex;align-items:center;gap:10px;padding:9px 4px 2px}
.img-info .fname{flex:1;min-width:0;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-info .fmeta{font-size:10.5px;color:var(--dim);flex-shrink:0}
.img-info .act{display:flex;gap:5px;flex-shrink:0}
.img-info .act button{width:26px;height:26px;border-radius:8px}
/* 文件卡（编辑弹窗复用 .filebody/.fic 卡片样式） */
.edit-file-note{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.6}
</style>
</head>
